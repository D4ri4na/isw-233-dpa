<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Dariana Pol</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS: bloques individuales -->
    <link rel="stylesheet" href="blocks/base.css">
    <link rel="stylesheet" href="blocks/header.css">
    <link rel="stylesheet" href="blocks/hero.css">
    <link rel="stylesheet" href="blocks/about.css">
    <link rel="stylesheet" href="blocks/blog.css">
    <link rel="stylesheet" href="blocks/projects.css">
    <link rel="stylesheet" href="blocks/experience.css">
    <link rel="stylesheet" href="blocks/contact.css">
    <link rel="stylesheet" href="blocks/footer.css">
    <link rel="stylesheet" href="blocks/dark-mode.css">

    <style>
        :root {
            --color-primary: #f39c12;
            --color-hover: #e67e22;
            --color-accent: #c8973a;
            --font-base: 'Poppins', sans-serif;
            --bg-light: #f5f1e8;
            --text-dark: #2c3e50;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="about.html" class="nav__link">Sobre Mí</a></li>
                    <li><a href="projects.html" class="nav__link">Mis Proyectos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contact" id="contact">
            <div class="container">

                <!-- Título -->
                <div class="section-header">
                    <h2>Contacto</h2>
                    <span class="section-header__line"></span>
                    <p class="blog__subtitle">¿Tienes un proyecto en mente? ¡Hablemos!</p>
                </div>

                <div class="contact__grid">

                    <!-- Columna izquierda: info -->
                    <div class="contact__info">
                        <h3>Información de Contacto</h3>

                        <div class="contact__item">
                            <span class="contact__item-icon">✉️</span>
                            <div>
                                <strong>Email</strong>
                                <p>dpolaramayo@gmail.com</p>
                            </div>
                        </div>

                        <div class="contact__item">
                            <span class="contact__item-icon">📞</span>
                            <div>
                                <strong>Teléfono</strong>
                                <p>+591 78004539</p>
                            </div>
                        </div>

                        <div class="contact__item">
                            <span class="contact__item-icon">📍</span>
                            <div>
                                <p>Universidad Católica Boliviana "San Pablo"</p>
                                <p>Santa Cruz, Bolivia</p>
                            </div>
                        </div>

                        <h4>Redes Sociales</h4>
                        <div class="social-links">
                            <a href="https://www.linkedin.com/in/dariana-pol-aramayo/" target="_blank" class="social-links__link">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linkedin/linkedin-original.svg" width="28" alt="LinkedIn">
                            </a>
                            <a href="https://github.com/D4ri4na" target="_blank" class="social-links__link">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" width="28" alt="GitHub">
                            </a>
                        </div>
                    </div>

                    <!-- Columna derecha: formulario -->
                    <div class="contact__form">
                        <h3>Envíame un Mensaje</h3>
                        <form id="contactForm">
                            <label>
                                Nombre
                                <input type="text" name="nombre" placeholder="Tu nombre completo" required>
                            </label>
                            <label>
                                Email
                                <input type="email" name="email" placeholder="tu@email.com" required>
                            </label>
                            <label>
                                Asunto
                                <input type="text" name="asunto" placeholder="¿De qué quieres hablar?" required>
                            </label>
                            <label>
                                Mensaje
                                <textarea name="mensaje" rows="4" placeholder="Cuéntame sobre tu proyecto..." required></textarea>
                            </label>
                            <button type="submit">
                                <span>✈</span> Enviar Mensaje
                            </button>
                        </form>
                    </div>

                </div>

                <div class="back-home">
                    <a href="index.html">← Volver a inicio</a>
                </div>

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <button class="dark-mode-btn" id="darkModeBtn" aria-label="Cambiar modo oscuro">🌙</button>
    <script src="script.js"></script>
</body>
</html>
