<!DOCTYPE html>
<html lang="es">
<head>
    <title>Dariana Pol — Portfolio</title>
    {{> head}}
    <script>
        (function () {
            const path = window.location.pathname;
            if (path && path !== '/' && path !== '/index.html') {
                sessionStorage.setItem('spa:route', path + window.location.search);
            }
        })();
    </script>
</head>
<body>
    <app-header></app-header>
    <main id="app-root" style="padding-top:70px; min-height:calc(100vh - 70px)"></main>
    <app-footer></app-footer>

    {{> blog-card-template}}
    {{> dark-mode-btn}}

    <script type="module" src="/main.js"></script>
    
</body>
</html>
