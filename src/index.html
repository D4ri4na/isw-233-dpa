<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dariana Pol — Portfolio</title>
    <style>
        :root {
            --color-primary: #f39c12;
            --color-hover:   #e67e22;
            --color-accent:  #c8973a;
            --font-base:     'Poppins', sans-serif;
            --bg-light:      #f5f1e8;
            --text-dark:     #2c3e50;
            --text-muted:    #777;
            --white:         #ffffff;
            --shadow-sm:     0 4px 15px rgba(0,0,0,0.05);
            --shadow-md:     0 4px 16px rgba(0,0,0,0.08);
            --radius-sm:     10px;
            --radius-md:     12px;
            --radius-lg:     16px;
        }
        .nav__link--active {
            background-color: #2c3e50 !important;
            color: white !important;
        }
    </style>
    <script>
        (function () {
            const path = window.location.pathname;
            if (path && path !== '/' && path !== '/index.html') {
                sessionStorage.setItem('spa:route', path + window.location.search);
            }
        })();
    </script>
</head>
<body>
    <app-header></app-header>
    <main id="app-root" style="padding-top:70px; min-height:calc(100vh - 70px)"></main>
    <app-footer></app-footer>
    <template id="tpl-blog-card">
        <article class="blog__card">
            <span class="blog__date"></span>
            <span class="blog__tag"></span>
            <h3 class="blog__title"></h3>
            <p class="blog__preview"></p>
            <div class="blog__more"><p></p></div>
            <div class="blog__actions">
                <button class="blog__read-more">Leer más →</button>
                <button class="blog__fav-btn" title="Marcar como favorito">🤍</button>
            </div>
        </article>
    </template>
    <script type="module" src="/main.js"></script>
</body>
</html>
